spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:11521/FREEPDB1}
    username: ${APP_USER:BUDGET_APP}
    password: ${APP_USER_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
