name: it-new-edu
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Run infra/init-local.ps1 first}
      APP_USER: BUDGET_APP
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Run infra/init-local.ps1 first}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${ORACLE_PORT:-11521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  app:
    profiles: ["app"]
    build: .
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      APP_USER: BUDGET_APP
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Run infra/init-local.ps1 first}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped
volumes:
  oracle-data:
